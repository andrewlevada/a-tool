<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="UTF-8" />
</head>

<body>
  <div id="scene-container">
    <!-- Our <canvas> will be inserted here -->
  </div>
  <div id="controls" style="visibility:hidden">
    <div
      style="z-index: 1; color:white; position: absolute; top: 20px; width: 100%; text-align: center; font-family: sans-serif">
      A 3D image with just a browser and a webcam<br>Press "C" to only keep the 3D image</div>
    <div id="video-container" style="position:absolute; left:0; bottom:0;">
      <video autoplay="true" style="width:200px; margin:10px;" id="video">
      </video>
    </div>
  </div>
</body>
